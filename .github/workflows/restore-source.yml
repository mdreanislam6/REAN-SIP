name: Restore CallerX source

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_ARCHIVE: https://d.uguu.se/yWKHNcLfvhYB.xz
  SOURCE_SHA256: d6a6d77266f8c88fdef242b906aa6135e7f0e0aabfb642899e8c0d8cfad0cb4b

jobs:
  restore:
    name: Unpack source into the repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and unpack the source archive
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 "$SOURCE_ARCHIVE" -o /tmp/src.tar.xz
          echo "$SOURCE_SHA256  /tmp/src.tar.xz" | sha256sum -c -
          rm -rf src scripts assets blob
          rm -f app.json package.json tsconfig.json eas.json README.md BUILD_GUIDE.md .env.example
          tar xf /tmp/src.tar.xz -C .
          echo "--- restored tree ---"
          find src -type f | sort

      - name: Commit and push the source
        run: |
          set -euo pipefail
          git config user.name "mdreanislam6"
          git config user.email "mdreanislam6@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat(callerx): native Android app source (all screens)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
