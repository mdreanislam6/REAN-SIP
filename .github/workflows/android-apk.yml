name: Build CallerX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: callerx-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA256: 0cff6844307bf186082d36486f30dd757d53846bebbe76a928fc409cf16e97a6

jobs:
  # ------------------------------------------------------------------ restore
  # The CallerX source ships as a compressed archive split into base64 chunks
  # under blob/. This job reassembles it and commits the real source files once.
  restore:
    name: Restore source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is the source already in place?
        id: check
        run: |
          if [ -f src/app/call.tsx ] && [ -f src/components/kit.tsx ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Source already present - skipping restore."
          else
            echo "restored=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reassemble and unpack the source archive
        if: steps.check.outputs.restored == 'true'
        run: |
          set -euo pipefail
          ls -l blob/
          cat blob/e*.b64 | tr -d '\n' > /tmp/src.b64
          base64 -d /tmp/src.b64 > /tmp/src.tar.xz
          echo "$SOURCE_SHA256  /tmp/src.tar.xz" | sha256sum -c -
          rm -rf src scripts assets blob
          rm -f app.json package.json tsconfig.json eas.json README.md BUILD_GUIDE.md .env.example
          tar xf /tmp/src.tar.xz -C .
          echo "--- restored tree ---"
          find src -type f | sort

      - name: Commit the restored source
        if: steps.check.outputs.restored == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat(callerx): native Android app source (all screens)"
            git push origin HEAD:main
          fi

  # -------------------------------------------------------------------- build
  build:
    name: Build APK
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate app icon and ringtone
        run: npm run assets

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/callerx.apk \;
          ls -lh out/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: callerx-apk
          path: out/callerx.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7

      - name: Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callerx-${{ github.run_number }}
          name: CallerX APK build ${{ github.run_number }}
          body: |
            Automatic APK build from commit ${{ github.sha }}.
            Download `callerx.apk` below and install it on an Android phone.
          files: out/callerx.apk
          make_latest: true
