name: Build CallerX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: callerx-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_ARCHIVE: https://d.uguu.se/yWKHNcLfvhYB.xz
  SOURCE_SHA256: d6a6d77266f8c88fdef242b906aa6135e7f0e0aabfb642899e8c0d8cfad0cb4b

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      # The CallerX source ships as a compressed archive. Unpack it over the
      # checkout so the build always uses the current app source.
      - name: Unpack CallerX source
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 "$SOURCE_ARCHIVE" -o /tmp/src.tar.xz
          echo "$SOURCE_SHA256  /tmp/src.tar.xz" | sha256sum -c -
          rm -rf src scripts assets
          rm -f app.json package.json tsconfig.json eas.json README.md BUILD_GUIDE.md .env.example
          tar xf /tmp/src.tar.xz -C .
          echo "--- source tree ---"
          find src -type f | sort

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate app icon and ringtone
        run: npm run assets

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/callerx.apk \;
          ls -lh out/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: callerx-apk
          path: out/callerx.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          retention-days: 7

      - name: Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callerx-${{ github.run_number }}
          name: CallerX APK build ${{ github.run_number }}
          body: |
            Automatic APK build from commit ${{ github.sha }}.
            Download `callerx.apk` below and install it on an Android phone.
          files: out/callerx.apk
          make_latest: true
