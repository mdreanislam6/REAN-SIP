name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Generate app icon and ringtone
        run: npm run assets

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/rean-sip.apk \;
          ls -lh out/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rean-sip-apk
          path: out/rean-sip.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: REAN SIP APK build ${{ github.run_number }}
          body: |
            Automatic APK build from commit ${{ github.sha }}.
            Download `rean-sip.apk` below and install it on an Android phone.
          files: out/rean-sip.apk
          make_latest: true
